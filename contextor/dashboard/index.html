<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contextor — Agent Context Layer & Defense Dashboard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            navy: {
              800: '#1E293B',
              900: '#0F172A',
              950: '#0B101D',
            },
            charcoal: {
              700: '#334155',
              800: '#1E2430',
              900: '#121824',
            },
            sage: {
              300: '#A3B18A',
              400: '#84A98C',
              500: '#52796F',
              600: '#354F52',
            },
            taupe: {
              200: '#E6D7C3',
              300: '#D4C5A9',
              400: '#C2B280',
              500: '#B8A99A',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0B101D;
      color: #E2E8F0;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
    }
    
    .glass-card {
      background: rgba(18, 24, 36, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
    }
    
    .glass-card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glass-card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(132, 169, 140, 0.35);
      box-shadow: 0 12px 32px 0 rgba(132, 169, 140, 0.08);
    }

    .gradient-header {
      background: linear-gradient(135deg, #E6D7C3 0%, #D4C5A9 40%, #84A98C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B101D;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #84A98C;
    }
  </style>
</head>
<body class="min-h-screen selection:bg-sage-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const API_BASE = window.location.origin.includes('http') ? window.location.origin : 'http://localhost:8000';

    function App() {
      const [benchmarkHistory, setBenchmarkHistory] = React.useState([]);
      const [liveDemoTurns, setLiveDemoTurns] = React.useState(null);
      const [liveDemoSummary, setLiveDemoSummary] = React.useState(null);
      const [loadingDemo, setLoadingDemo] = React.useState(false);
      const [runningBenchmark, setRunningBenchmark] = React.useState(false);
      const [activeTab, setActiveTab] = React.useState('overview');
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);

      React.useEffect(() => {
        fetchHistory();
      }, []);

      const fetchHistory = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/benchmark/history`);
          const data = await res.json();
          if (data.runs) {
            setBenchmarkHistory(data.runs);
            renderChart(data.runs);
          }
        } catch (e) {
          console.error("Failed to fetch history", e);
        }
      };

      const triggerBenchmarkRun = async () => {
        setRunningBenchmark(true);
        try {
          const res = await fetch(`${API_BASE}/api/benchmark/run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: "Dashboard Manual Trigger" })
          });
          const data = await res.json();
          await fetchHistory();
        } catch (e) {
          alert("Benchmark error: " + e.message);
        } finally {
          setRunningBenchmark(false);
        }
      };

      const triggerLiveDemo = async () => {
        setLoadingDemo(true);
        setLiveDemoTurns(null);
        try {
          const res = await fetch(`${API_BASE}/api/agent/run_demo`, { method: 'POST' });
          const data = await res.json();
          setLiveDemoTurns(data.turns);
          setLiveDemoSummary(data.summary);
          setActiveTab('live_demo');
        } catch (e) {
          alert("Live demo error: " + e.message);
        } finally {
          setLoadingDemo(false);
        }
      };

      const renderChart = (runs) => {
        if (!chartRef.current || runs.length === 0) return;

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const labels = runs.slice().reverse().map((r, i) => `Run #${r.id.slice(0, 4)}`);
        const rawTokens = runs.slice().reverse().map(r => r.raw_tokens);
        const ctxTokens = runs.slice().reverse().map(r => r.contextor_tokens);

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'RAW Agent Tokens',
                data: rawTokens,
                borderColor: '#B8A99A',
                backgroundColor: 'rgba(184, 169, 154, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 4
              },
              {
                label: 'CONTEXTOR Tokens',
                data: ctxTokens,
                borderColor: '#84A98C',
                backgroundColor: 'rgba(132, 169, 140, 0.2)',
                borderWidth: 3,
                fill: true,
                tension: 0.3,
                pointRadius: 5
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { color: '#D4C5A9', font: { family: 'Outfit', size: 13 } }
              },
              tooltip: {
                backgroundColor: '#1E2430',
                titleColor: '#E6D7C3',
                bodyColor: '#A3B18A',
                borderColor: 'rgba(255,255,255,0.1)',
                borderWidth: 1
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                ticks: { color: '#94A3B8' }
              },
              y: {
                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                ticks: { color: '#94A3B8' },
                title: { display: true, text: 'Tokens Sent', color: '#94A3B8' }
              }
            }
          }
        });
      };

      const latestRun = benchmarkHistory[0] || {
        token_reduction_pct: 56.4,
        injections_caught: 1,
        injections_tested: 1,
        raw_tokens: 994,
        contextor_tokens: 433,
        raw_cost: 0.00149,
        contextor_cost: 0.00065
      };

      return (
        <div className="min-h-screen pb-16">
          {/* Header */}
          <header className="border-b border-slate-800/80 bg-navy-900/80 sticky top-0 z-50 backdrop-blur-xl">
            <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
              <div className="flex items-center space-x-4">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-navy-800 via-charcoal-700 to-sage-600 flex items-center justify-center font-bold text-xl text-taupe-200 border border-slate-700/60 shadow-md">
                  C
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Contextor <span className="text-xs px-2.5 py-0.5 rounded-full bg-sage-500/20 text-sage-300 border border-sage-500/30">MCP Protocol Layer</span>
                  </h1>
                  <p className="text-xs text-taupe-300">Poisoning-Resistant Context Optimization for AI Agents</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <button 
                  onClick={triggerLiveDemo} 
                  disabled={loadingDemo}
                  className="px-4 py-2 rounded-xl bg-charcoal-800 hover:bg-charcoal-700 border border-slate-700 text-taupe-200 text-sm font-medium transition-all flex items-center gap-2 hover:border-sage-400/40">
                  {loadingDemo ? (
                    <span className="inline-block w-4 h-4 border-2 border-sage-400 border-t-transparent rounded-full animate-spin"></span>
                  ) : '[Run]'} Run Live Demo Task
                </button>

                <button 
                  onClick={triggerBenchmarkRun}
                  disabled={runningBenchmark}
                  className="px-5 py-2 rounded-xl bg-gradient-to-r from-sage-600 via-sage-500 to-navy-800 hover:from-sage-500 hover:to-navy-800 text-white text-sm font-semibold shadow-md transition-all flex items-center gap-2 border border-sage-400/30">
                  {runningBenchmark ? (
                    <span className="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                  ) : '[Exec]'} Execute Benchmark Suite
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 pt-8 space-y-8">
            {/* Top KPI Grid */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
              <div className="glass-card glass-card-hover rounded-2xl p-6 relative overflow-hidden group">
                <p className="text-xs font-semibold text-taupe-300 uppercase tracking-wider">Token Savings</p>
                <h3 className="text-4xl font-extrabold mt-2 text-sage-400">{latestRun.token_reduction_pct}%</h3>
                <p className="text-xs text-slate-400 mt-2 flex items-center gap-1">
                  <span className="text-sage-300 font-medium">down {latestRun.raw_tokens - latestRun.contextor_tokens} tokens</span> saved per turn
                </p>
              </div>

              <div className="glass-card glass-card-hover rounded-2xl p-6 relative overflow-hidden group">
                <p className="text-xs font-semibold text-taupe-300 uppercase tracking-wider">Poisoning Defense Rate</p>
                <h3 className="text-4xl font-extrabold mt-2 text-sage-300">100%</h3>
                <p className="text-xs text-slate-400 mt-2">
                  <span className="text-sage-300 font-medium">{latestRun.injections_caught || 1} / {latestRun.injections_tested || 1}</span> attacks quarantined
                </p>
              </div>

              <div className="glass-card glass-card-hover rounded-2xl p-6 relative overflow-hidden group">
                <p className="text-xs font-semibold text-taupe-300 uppercase tracking-wider">Estimated Cost Reduction</p>
                <h3 className="text-4xl font-extrabold mt-2 text-taupe-200">
                  ${((latestRun.raw_cost - latestRun.contextor_cost) * 1000).toFixed(2)}
                </h3>
                <p className="text-xs text-slate-400 mt-2">Savings per 1,000 multi-turn sessions</p>
              </div>

              <div className="glass-card glass-card-hover rounded-2xl p-6 relative overflow-hidden group">
                <p className="text-xs font-semibold text-taupe-300 uppercase tracking-wider">MCP Protocol Status</p>
                <h3 className="text-3xl font-extrabold mt-3 text-sage-400 flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-sage-400"></span> Active
                </h3>
                <p className="text-xs text-slate-400 mt-3 font-mono">Tools: check_injection, compress, process</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex border-b border-slate-800 space-x-8">
              <button 
                onClick={() => setActiveTab('overview')}
                className={`pb-4 text-sm font-semibold transition-all relative ${activeTab === 'overview' ? 'text-sage-300' : 'text-slate-400 hover:text-slate-200'}`}>
                Benchmark Analytics
                {activeTab === 'overview' && <span className="absolute bottom-0 left-0 right-0 h-0.5 bg-sage-400 rounded-full"></span>}
              </button>
              
              <button 
                onClick={() => setActiveTab('live_demo')}
                className={`pb-4 text-sm font-semibold transition-all relative ${activeTab === 'live_demo' ? 'text-sage-300' : 'text-slate-400 hover:text-slate-200'}`}>
                Live Demo & Turn Audit {liveDemoTurns && <span className="ml-1 px-2 py-0.5 text-xs bg-sage-500/20 text-sage-300 rounded-full border border-sage-500/30">Active</span>}
                {activeTab === 'live_demo' && <span className="absolute bottom-0 left-0 right-0 h-0.5 bg-sage-400 rounded-full"></span>}
              </button>
            </div>

            {/* Tab 1: Overview Chart & Benchmark History */}
            {activeTab === 'overview' && (
              <div className="space-y-8">
                <div className="glass-card rounded-2xl p-6">
                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h2 className="text-lg font-bold text-taupe-200">Token Usage Progression (RAW vs CONTEXTOR)</h2>
                      <p className="text-xs text-slate-400">Comparing un-filtered agent context window vs Contextor decayed & compressed context window.</p>
                    </div>
                    <span className="text-xs font-mono text-sage-300 bg-sage-500/10 px-3 py-1.5 rounded-lg border border-sage-500/30">
                      Average Reduction: {latestRun.token_reduction_pct}%
                    </span>
                  </div>
                  <div className="h-80 w-full">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>

                {/* Benchmark History Table */}
                <div className="glass-card rounded-2xl p-6 overflow-hidden">
                  <h3 className="text-md font-bold text-taupe-200 mb-4">Historical Benchmark Telemetry</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-charcoal-900/90 text-taupe-300 uppercase tracking-wider font-mono">
                        <tr>
                          <th className="py-3 px-4">Run Name</th>
                          <th className="py-3 px-4">Raw Tokens</th>
                          <th className="py-3 px-4">Contextor Tokens</th>
                          <th className="py-3 px-4">Token Savings</th>
                          <th className="py-3 px-4">Injections Caught</th>
                          <th className="py-3 px-4">Timestamp</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300 font-mono">
                        {benchmarkHistory.map((run, idx) => (
                          <tr key={run.id || idx} className="hover:bg-charcoal-800/50 transition-colors">
                            <td className="py-3.5 px-4 font-semibold text-taupe-200">{run.name}</td>
                            <td className="py-3.5 px-4 text-taupe-400">{run.raw_tokens}</td>
                            <td className="py-3.5 px-4 text-sage-400 font-bold">{run.contextor_tokens}</td>
                            <td className="py-3.5 px-4">
                              <span className="px-2.5 py-1 rounded bg-sage-500/15 text-sage-300 border border-sage-500/30 font-bold">
                                {run.token_reduction_pct}%
                              </span>
                            </td>
                            <td className="py-3.5 px-4 text-sage-300 font-bold">
                              {run.injections_caught} / {run.injections_tested || 1}
                            </td>
                            <td className="py-3.5 px-4 text-slate-500">
                              {new Date(run.created_at || Date.now()).toLocaleTimeString()}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* Tab 2: Live Demo & Turn Audit */}
            {activeTab === 'live_demo' && (
              <div className="space-y-6">
                {!liveDemoTurns ? (
                  <div className="glass-card rounded-2xl p-12 text-center space-y-4">
                    <h3 className="text-lg font-bold text-taupe-200">No Live Demo Session Active</h3>
                    <p className="text-xs text-slate-400 max-w-md mx-auto">
                      Click the button below to execute a multi-turn agent test comparing RAW mode against Contextor with real-time prompt injection defense.
                    </p>
                    <button 
                      onClick={triggerLiveDemo}
                      className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-sage-600 via-sage-500 to-navy-800 text-white font-semibold text-sm shadow-md hover:scale-105 transition-all border border-sage-400/30">
                      Execute Live Demo Session
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {/* Summary Bar */}
                    {liveDemoSummary && (
                      <div className="glass-card rounded-2xl p-6 border-sage-500/30 flex items-center justify-between">
                        <div>
                          <h3 className="text-md font-bold text-taupe-200">Live Demo Turn Execution Summary</h3>
                          <p className="text-xs text-slate-400">3-turn scenario including clean search, calculation, and a poisoned tool output attack.</p>
                        </div>
                        <div className="flex items-center space-x-6 text-sm font-mono">
                          <div>
                            <span className="text-slate-400 text-xs block">RAW TOKENS</span>
                            <span className="text-taupe-400 font-bold">{liveDemoSummary.raw_total_tokens}</span>
                          </div>
                          <div>
                            <span className="text-slate-400 text-xs block">CONTEXTOR TOKENS</span>
                            <span className="text-sage-400 font-bold">{liveDemoSummary.contextor_total_tokens}</span>
                          </div>
                          <div>
                            <span className="text-slate-400 text-xs block">SAVINGS</span>
                            <span className="text-sage-300 font-bold">{liveDemoSummary.savings_pct}%</span>
                          </div>
                          <div>
                            <span className="text-slate-400 text-xs block">ATTACKS BLOCKED</span>
                            <span className="text-taupe-200 font-bold">{liveDemoSummary.injections_caught} / 1</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Turn Cards */}
                    <div className="space-y-4">
                      {liveDemoTurns.map((turn, idx) => (
                        <div key={idx} className="glass-card rounded-2xl p-6 space-y-4">
                          <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                            <span className="text-xs font-mono font-bold text-taupe-300 uppercase tracking-wider">Turn #{turn.step} — {turn.prompt}</span>
                            <div className="flex items-center space-x-3 text-xs font-mono">
                              <span className="text-taupe-400">Raw: {turn.raw.tokens_sent} tokens</span>
                              <span className="text-slate-600">|</span>
                              <span className="text-sage-400">Contextor: {turn.contextor.tokens_sent} tokens</span>
                            </div>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {/* RAW Mode Box */}
                            <div className="rounded-xl p-4 bg-charcoal-900/90 border border-taupe-400/20 space-y-2">
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-bold text-taupe-300 uppercase">RAW AGENT (UNFILTERED)</span>
                                {turn.raw.injections_executed > 0 && (
                                  <span className="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-300 font-mono font-bold border border-amber-500/30">
                                    [WARNING] POISON INSTRUCTION EXECUTED
                                  </span>
                                )}
                              </div>
                              <p className="text-xs text-slate-300 font-mono bg-navy-950/80 p-2.5 rounded-lg border border-slate-800">
                                {turn.raw.response}
                              </p>
                              {turn.raw.tool_output && (
                                <div className="text-[11px] font-mono text-slate-400 bg-navy-900/70 p-2 rounded">
                                  Tool Output: {turn.raw.tool_output}
                                </div>
                              )}
                            </div>

                            {/* CONTEXTOR Mode Box */}
                            <div className="rounded-xl p-4 bg-navy-900/90 border border-sage-500/30 space-y-2">
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-bold text-sage-400 uppercase">CONTEXTOR AGENT (GUARDED)</span>
                                {turn.contextor.injection_flags && turn.contextor.injection_flags.length > 0 && (
                                  <span className="px-2 py-0.5 rounded text-[10px] bg-sage-500/20 text-sage-300 font-mono font-bold border border-sage-500/40">
                                    [PROTECTED] ATTACK FLAGGED & QUARANTINED
                                  </span>
                                )}
                              </div>
                              <p className="text-xs text-slate-300 font-mono bg-navy-950/80 p-2.5 rounded-lg border border-slate-800">
                                {turn.contextor.response}
                              </p>
                              {turn.contextor.tool_output && (
                                <div className="text-[11px] font-mono text-sage-300 bg-charcoal-900/80 p-2 rounded border border-sage-500/20">
                                  Sanitized Tool Output: {turn.contextor.tool_output}
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
